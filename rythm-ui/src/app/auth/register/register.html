<div class="relative w-screen h-screen bg-gray-900">

  <!-- WebGL Background -->
  <canvas #canvas class="absolute inset-0 w-full h-full"></canvas>
  <div class="absolute inset-0 backdrop-blur-sm"></div>

  <!-- Register Form -->
  <div class="relative z-10 flex items-center justify-center min-h-screen p-4 py-8">
    <div class="w-full max-w-sm p-8 space-y-6 bg-white/10 backdrop-blur-lg rounded-2xl border border-white/20 shadow-2xl">

      <div class="text-center">
        <h1 class="text-3xl font-bold text-green-400">Rythm</h1>
        <h2 class="text-2xl font-bold text-white mt-2">Hesap Oluştur</h2>
        <p class="mt-2 text-sm text-gray-300">Müziğin dünyasına katıl</p>
      </div>

      <div class="space-y-6">

        <div class="relative z-0">
          <input type="text" placeholder=" " [(ngModel)]="model.firstName"
            class="block py-2.5 px-0 w-full text-sm text-white bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-green-500 peer" />
          <label class="absolute text-sm text-gray-300 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 peer-focus:text-green-400">
            Ad
          </label>
        </div>

        <div class="relative z-0">
          <input type="text" placeholder=" " [(ngModel)]="model.lastName"
            class="block py-2.5 px-0 w-full text-sm text-white bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-green-500 peer" />
          <label class="absolute text-sm text-gray-300 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 peer-focus:text-green-400">
            Soyad
          </label>
        </div>

        <div class="relative z-0">
          <input type="text" placeholder=" " [(ngModel)]="model.userName"
            class="block py-2.5 px-0 w-full text-sm text-white bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-green-500 peer" />
          <label class="absolute text-sm text-gray-300 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 peer-focus:text-green-400">
            Kullanıcı Adı
          </label>
        </div>

        <div class="relative z-0">
          <input type="email" placeholder=" " [(ngModel)]="model.email"
            class="block py-2.5 px-0 w-full text-sm text-white bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-green-500 peer" />
          <label class="absolute text-sm text-gray-300 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 peer-focus:text-green-400">
            Email
          </label>
        </div>

        <div class="relative z-0">
          <input type="password" placeholder=" " [(ngModel)]="model.password"
            class="block py-2.5 px-0 w-full text-sm text-white bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-green-500 peer" />
          <label class="absolute text-sm text-gray-300 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0] peer-placeholder-shown:scale-100 peer-placeholder-shown:translate-y-0 peer-focus:scale-75 peer-focus:-translate-y-6 peer-focus:text-green-400">
            Şifre
          </label>
        </div>

        <div class="relative z-0">
          <input type="date" [(ngModel)]="model.birthDate"
            class="block py-2.5 px-0 w-full text-sm text-white bg-transparent border-0 border-b-2 border-gray-300 appearance-none focus:outline-none focus:ring-0 focus:border-green-500 [color-scheme:dark]" />
          <label class="absolute text-sm text-green-400 duration-300 transform -translate-y-6 scale-75 top-3 -z-10 origin-[0]">
            Doğum Tarihi
          </label>
        </div>

        <button
          (click)="onRegister()"
          class="group w-full flex items-center justify-center py-3 px-4 bg-green-500 hover:bg-green-400 rounded-lg text-black font-semibold transition-all duration-300">
          Kayıt Ol
          <span class="ml-2 transform group-hover:translate-x-1 transition-transform">→</span>
        </button>

        <p class="text-center text-xs text-gray-400">
          Zaten hesabın var mı?
          <a routerLink="/login" class="font-semibold text-green-400 hover:text-green-300 transition">
            Giriş Yap
          </a>
        </p>

      </div>
    </div>
  </div>

</div>
