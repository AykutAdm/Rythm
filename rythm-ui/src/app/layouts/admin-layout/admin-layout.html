<div class="min-h-screen flex overflow-x-hidden relative" [class.sidebar-collapsed]="isCollapsed">

  <!-- Shader Background -->
  <canvas #shaderCanvas class="fixed inset-0 w-full h-full -z-10"></canvas>

  <!-- Sidebar -->
  <nav class="hidden md:flex flex-col py-8 px-4 h-screen fixed left-0 top-0 bg-zinc-950/75 border-r border-white/10 shadow-xl z-50 transition-all duration-300"
    [class.w-[240px]]="!isCollapsed"
    [class.w-[80px]]="isCollapsed">

    <!-- Logo -->
    <div class="flex items-center gap-3 mb-10 px-2" [class.justify-center]="isCollapsed">
      <button
        (click)="toggleSidebar()"
        class="w-10 h-10 rounded-lg flex items-center justify-center hover:bg-white/5 text-white transition-colors flex-shrink-0">
        <span class="material-symbols-outlined text-xl">menu</span>
      </button>
      <div *ngIf="!isCollapsed" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-blue-500/20 flex items-center justify-center border border-blue-500/30 flex-shrink-0">
          <span class="material-symbols-outlined text-blue-400 text-xl">graphic_eq</span>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-blue-400 leading-none">Rythm</h1>
          <span class="text-[10px] text-zinc-400 uppercase tracking-wider block mt-1">Audio Engine</span>
        </div>
      </div>
    </div>

    <!-- Menü Linkleri -->
    <div class="flex-1 space-y-1">

      <a routerLink="/admin/dashboard" routerLinkActive="text-blue-400 bg-blue-500/10 border-r-2 border-blue-400"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-zinc-400 hover:text-white hover:bg-white/5 transition-all duration-200"
        [class.justify-center]="isCollapsed" [class.px-0]="isCollapsed">
        <span class="material-symbols-outlined flex-shrink-0" style="font-variation-settings: 'FILL' 1;">dashboard</span>
        <span *ngIf="!isCollapsed">Dashboard</span>
      </a>

      <a routerLink="/admin/songs" routerLinkActive="text-blue-400 bg-blue-500/10 border-r-2 border-blue-400"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-zinc-400 hover:text-white hover:bg-white/5 transition-all duration-200"
        [class.justify-center]="isCollapsed" [class.px-0]="isCollapsed">
        <span class="material-symbols-outlined flex-shrink-0">music_note</span>
        <span *ngIf="!isCollapsed">Songs</span>
      </a>

      <a routerLink="/admin/albums" routerLinkActive="text-blue-400 bg-blue-500/10 border-r-2 border-blue-400"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-zinc-400 hover:text-white hover:bg-white/5 transition-all duration-200"
        [class.justify-center]="isCollapsed" [class.px-0]="isCollapsed">
        <span class="material-symbols-outlined flex-shrink-0">album</span>
        <span *ngIf="!isCollapsed">Albums</span>
      </a>

      <a routerLink="/admin/artists" routerLinkActive="text-blue-400 bg-blue-500/10 border-r-2 border-blue-400"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-zinc-400 hover:text-white hover:bg-white/5 transition-all duration-200"
        [class.justify-center]="isCollapsed" [class.px-0]="isCollapsed">
        <span class="material-symbols-outlined flex-shrink-0">artist</span>
        <span *ngIf="!isCollapsed">Artists</span>
      </a>

      <a routerLink="/admin/genres" routerLinkActive="text-blue-400 bg-blue-500/10 border-r-2 border-blue-400"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-zinc-400 hover:text-white hover:bg-white/5 transition-all duration-200"
        [class.justify-center]="isCollapsed" [class.px-0]="isCollapsed">
        <span class="material-symbols-outlined flex-shrink-0">category</span>
        <span *ngIf="!isCollapsed">Genres</span>
      </a>

      <a routerLink="/admin/users" routerLinkActive="text-blue-400 bg-blue-500/10 border-r-2 border-blue-400"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-zinc-400 hover:text-white hover:bg-white/5 transition-all duration-200"
        [class.justify-center]="isCollapsed" [class.px-0]="isCollapsed">
        <span class="material-symbols-outlined flex-shrink-0">admin_panel_settings</span>
        <span *ngIf="!isCollapsed">Roles</span>
      </a>

    </div>

    <!-- Alt Kısım -->
    <div class="mt-auto space-y-4">
      <div class="border-t border-white/5 pt-4 space-y-1">
        <button
          (click)="onLogout()"
          class="w-full flex items-center gap-3 px-4 py-2 rounded-lg text-zinc-400 hover:text-white hover:bg-white/5 transition-all duration-200"
          [class.justify-center]="isCollapsed" [class.px-0]="isCollapsed">
          <span class="material-symbols-outlined flex-shrink-0">logout</span>
          <span *ngIf="!isCollapsed">Logout</span>
        </button>
      </div>
    </div>

  </nav>

  <!-- Sağ Taraf -->
  <div class="flex-1 flex flex-col min-w-0 transition-all duration-300"
    [class.md:ml-[240px]]="!isCollapsed"
    [class.md:ml-[80px]]="isCollapsed">

    <!-- Top Bar -->
    <header class="fixed top-0 right-0 h-16 bg-zinc-950/75 border-b border-white/5 z-40 flex justify-between items-center px-6 transition-all duration-300"
      [class.left-[240px]]="!isCollapsed"
      [class.left-[80px]]="isCollapsed">

      <!-- Arama -->
      <div class="relative w-64 hidden sm:block">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 text-sm">search</span>
        <input
          type="text"
          placeholder="Search library..."
          class="w-full bg-black/30 border border-white/10 rounded-lg pl-10 pr-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500 transition-colors placeholder:text-zinc-500"
        />
      </div>

      <!-- Sağ -->
      <div class="flex items-center gap-2">
        <button class="w-10 h-10 rounded-lg flex items-center justify-center text-zinc-400 hover:bg-white/5 hover:text-white transition-colors">
          <span class="material-symbols-outlined">notifications</span>
        </button>
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-400 to-purple-500 flex items-center justify-center text-black font-bold text-sm cursor-pointer hover:scale-105 transition-transform ml-2">
          A
        </div>
      </div>

    </header>

    <!-- İçerik -->
    <main class="flex-1 pt-20 pb-10 px-6 max-w-[1440px] mx-auto w-full">
      <router-outlet />
    </main>

  </div>

</div>
