<div class="space-y-4">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-white">Artists</h2>
      <p class="text-sm text-zinc-400 mt-1">{{ artists().length }} sanatçı listeleniyor</p>
    </div>
    <a
      routerLink="create"
      class="flex items-center gap-2 px-4 py-2 bg-blue-500 hover:bg-blue-400 text-white text-sm font-semibold rounded-xl transition-all duration-200 hover:scale-105"
    >
      <span class="material-symbols-outlined text-sm">add</span>
      Yeni Sanatçı
    </a>
  </div>

  <!-- Tablo -->
  <div class="bg-black/40 backdrop-blur-xl rounded-2xl border border-white/10 overflow-hidden">
    <table class="w-full">
      <!-- Tablo Header -->
      <thead>
        <tr class="border-b border-white/5">
          <th
            class="px-6 py-4 text-left text-xs font-semibold text-zinc-500 uppercase tracking-wider w-12"
          >
            #
          </th>
          <th
            class="px-6 py-4 text-left text-xs font-semibold text-zinc-500 uppercase tracking-wider w-16"
          >
            Profil
          </th>
          <th
            class="px-6 py-4 text-left text-xs font-semibold text-zinc-500 uppercase tracking-wider"
          >
            İsim
          </th>
          <th
            class="px-6 py-4 text-left text-xs font-semibold text-zinc-500 uppercase tracking-wider"
          >
            Bio
          </th>
          <th
            class="px-6 py-4 text-right text-xs font-semibold text-zinc-500 uppercase tracking-wider"
          >
            İşlemler
          </th>
        </tr>
      </thead>

      <!-- Tablo Satırları -->
      <tbody>
        @for (item of artists(); track item.artistId) {
          <tr class="border-b border-white/5 hover:bg-white/5 transition-all duration-200 group">
            <!-- Sıra -->
            <td class="px-6 py-4 text-sm text-zinc-500">{{ item.artistId }}</td>

            <!-- Profil -->
            <td class="px-6 py-4">
              <img
                src="{{ item.profileImageUrl }}"
                class="w-10 h-10 rounded-xl flex items-center justify-center"
                alt="{{ item.name.charAt(0) }}"
              />
            </td>

            <!-- İsim -->
            <td class="px-6 py-4">
              <p class="text-sm font-semibold text-white">{{ item.name }}</p>
            </td>

            <!-- Bio -->
            <td class="px-6 py-4">
              <p class="text-sm text-zinc-400 truncate max-w-xs">{{ item.bio || '—' }}</p>
            </td>

            <!-- İşlemler -->
            <td class="px-6 py-4">
              <div
                class="flex items-center justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity duration-200"
              >
                <a
                  [routerLink]="['/admin/artists/update', item.artistId]"
                  class="w-8 h-8 rounded-lg bg-white/5 hover:bg-blue-500/20 hover:text-blue-400 text-zinc-400 flex items-center justify-center transition-all duration-200"
                >
                  <span class="material-symbols-outlined text-sm">edit</span>
                </a>
                <a
                  (click)="delete(item.artistId)"
                  class="w-8 h-8 rounded-lg bg-white/5 hover:bg-red-500/20 hover:text-red-400 text-zinc-400 flex items-center justify-center transition-all duration-200"
                >
                  <span class="material-symbols-outlined text-sm">delete</span>
                </a>
              </div>
            </td>
          </tr>
        }

        <!-- Boş Durum -->
        @if (artists().length === 0) {
          <tr>
            <td colspan="5" class="px-6 py-16 text-center">
              <span class="material-symbols-outlined text-4xl text-zinc-500 block mb-3"
                >artist</span
              >
              <p class="text-sm text-zinc-500">Henüz sanatçı eklenmemiş</p>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
