<div class="space-y-6">

  <!-- Header -->
  <div class="flex items-center gap-4">
    <button
      routerLink="/admin/genres"
      type="button"
      class="w-9 h-9 rounded-xl bg-white/5 hover:bg-white/10 text-zinc-400 hover:text-white flex items-center justify-center transition-all duration-200">
      <span class="material-symbols-outlined text-sm">arrow_back</span>
    </button>
    <div>
      <h2 class="text-2xl font-bold text-white">Türü Düzenle</h2>
      <p class="text-sm text-zinc-400 mt-1">Tür bilgilerini güncelle</p>
    </div>
  </div>

  <!-- Form -->
  <form (ngSubmit)="onSubmit()" class="bg-black/40 backdrop-blur-xl rounded-2xl border border-white/10 p-6 space-y-6">

    <div class="space-y-2">
      <label class="text-sm font-medium text-zinc-400">İsim <span class="text-red-400">*</span></label>
      <input
        type="text"
        [(ngModel)]="model.name"
        name="name"
        placeholder="Tür adı"
        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder:text-zinc-600 focus:outline-none focus:border-blue-500 transition-colors"
      />
    </div>

    <div class="flex items-center justify-end gap-3 pt-2">
      <button
        type="button"
        routerLink="/admin/genres"
        class="px-6 py-2.5 bg-white/5 hover:bg-white/10 text-zinc-400 hover:text-white text-sm font-semibold rounded-xl transition-all duration-200">
        İptal
      </button>
      <button
        type="submit"
        class="flex items-center gap-2 px-6 py-2.5 bg-blue-500 hover:bg-blue-400 text-white text-sm font-semibold rounded-xl transition-all duration-200 hover:scale-105">
        <span class="material-symbols-outlined text-sm">save</span>
        Güncelle
      </button>
    </div>

  </form>

</div>
