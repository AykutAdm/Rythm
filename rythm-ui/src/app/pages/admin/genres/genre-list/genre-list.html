<div class="space-y-4">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-white">Genres</h2>
      <p class="text-sm text-zinc-400 mt-1">{{ genres().length }} tür listeleniyor</p>
    </div>
    <a
      routerLink="/admin/genres/create"
      class="flex items-center gap-2 px-4 py-2 bg-blue-500 hover:bg-blue-400 text-white text-sm font-semibold rounded-xl transition-all duration-200 hover:scale-105">
      <span class="material-symbols-outlined text-sm">add</span>
      Yeni Tür
    </a>
  </div>

  <!-- Tablo -->
  <div class="bg-black/40 backdrop-blur-xl rounded-2xl border border-white/10 overflow-hidden">
    <table class="w-full">

      <thead>
        <tr class="border-b border-white/5">
          <th class="px-6 py-4 text-left text-xs font-semibold text-zinc-500 uppercase tracking-wider w-12">#</th>
          <th class="px-6 py-4 text-left text-xs font-semibold text-zinc-500 uppercase tracking-wider">İsim</th>
          <th class="px-6 py-4 text-right text-xs font-semibold text-zinc-500 uppercase tracking-wider">İşlemler</th>
        </tr>
      </thead>

      <tbody>
        @for (item of genres(); track item.genreId) {
          <tr class="border-b border-white/5 hover:bg-white/5 transition-all duration-200 group">

            <td class="px-6 py-4 text-sm text-zinc-500">{{ $index + 1 }}</td>

            <td class="px-6 py-4">
              <p class="text-sm font-semibold text-white">{{ item.name }}</p>
            </td>

            <td class="px-6 py-4">
              <div class="flex items-center justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
                <a
                  [routerLink]="['/admin/genres/update', item.genreId]"
                  class="w-8 h-8 rounded-lg bg-white/5 hover:bg-blue-500/20 hover:text-blue-400 text-zinc-400 flex items-center justify-center transition-all duration-200">
                  <span class="material-symbols-outlined text-sm">edit</span>
                </a>
                <button
                  (click)="delete(item.genreId)"
                  class="w-8 h-8 rounded-lg bg-white/5 hover:bg-red-500/20 hover:text-red-400 text-zinc-400 flex items-center justify-center transition-all duration-200">
                  <span class="material-symbols-outlined text-sm">delete</span>
                </button>
              </div>
            </td>

          </tr>
        }

        @if (genres().length === 0) {
          <tr>
            <td colspan="3" class="px-6 py-16 text-center">
              <span class="material-symbols-outlined text-4xl text-zinc-500 block mb-3">category</span>
              <p class="text-sm text-zinc-500">Henüz tür eklenmemiş</p>
            </td>
          </tr>
        }

      </tbody>
    </table>
  </div>

</div>
