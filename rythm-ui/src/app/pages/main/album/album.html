<div class="p-6 space-y-8">
  @if (album(); as data) {
    <!-- Hero -->
    <div
      class="relative rounded-3xl overflow-hidden bg-gradient-to-br from-blue-900/50 to-purple-900/50 border border-white/10 p-8"
    >
      <div class="absolute inset-0 bg-gradient-to-br from-blue-500/10 to-purple-600/10"></div>

      <div class="relative z-10 flex items-end gap-8">
        <img
          [src]="data.coverImageUrl"
          [alt]="data.title"
          class="w-40 h-40 rounded-3xl object-cover shadow-2xl shrink-0"
        />

        <div class="space-y-2">
          <p class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Albüm</p>

          <h1 class="text-5xl font-black text-white">
            {{ data.title }}
          </h1>

          <p class="text-lg text-zinc-300">
            {{ data.artistName }}
          </p>

          <p class="text-sm text-zinc-400">
            {{ data.releaseDate | date: 'dd MMMM yyyy' }}
          </p>
        </div>
      </div>
    </div>

    <!-- Play Button -->
    <div class="flex items-center gap-4">
      <button
        class="w-14 h-14 bg-green-400 rounded-full flex items-center justify-center shadow-lg hover:scale-105 transition-all duration-200"
      >
        <span class="material-symbols-outlined text-black text-2xl"> play_arrow </span>
      </button>
    </div>

    <!-- Songs -->
    @if (data.songs.length > 0) {
      <section class="space-y-4">
        <h2 class="text-xl font-bold text-white">Şarkılar</h2>

        <div class="bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10 overflow-hidden">
          @for (song of data.songs; track song.songId) {
            <div
              class="flex items-center gap-4 px-6 py-4 border-b border-white/5 hover:bg-white/5 transition-all duration-200 group cursor-pointer"
            >
              <span class="text-sm text-zinc-500 w-6 text-center group-hover:hidden">
                {{ $index + 1 }}
              </span>

              <button class="w-6 hidden group-hover:flex items-center justify-center text-white">
                <span class="material-symbols-outlined text-sm"> play_arrow </span>
              </button>

              <img
                [src]="song.coverImageUrl"
                [alt]="song.title"
                class="w-10 h-10 rounded-xl object-cover shrink-0"
              />

              <div class="flex-1">
                <p class="text-sm font-semibold text-white">
                  {{ song.title }}
                </p>
              </div>

              <button
                class="w-8 h-8 rounded-lg text-zinc-500 hover:text-green-400 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-200"
              >
                <span class="material-symbols-outlined text-sm"> favorite </span>
              </button>
            </div>
          }
        </div>
      </section>
    }
  } @else {
    <div class="flex items-center justify-center py-16">
      <div
        class="w-8 h-8 border-2 border-green-400 border-t-transparent rounded-full animate-spin"
      ></div>
    </div>
  }
</div>
